# cargo-deny: лицензии и advisories (docs/legal.md, docs/ci-cd.md шаг 5).

[graph]
targets = [
  { triple = "x86_64-pc-windows-msvc" },
  { triple = "x86_64-unknown-linux-gnu" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "BSL-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[advisories]
version = 2
yanked = "warn"
ignore = [
  # RUSTSEC-2026-0192: ttf-parser не поддерживается. Тянется только dev-путём
  # winit -> sctk-adwaita -> ab_glyph; в рантайме движка не используется,
  # безопасного обновления пока нет. Пересмотреть при обновлении winit.
  "RUSTSEC-2026-0192",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
