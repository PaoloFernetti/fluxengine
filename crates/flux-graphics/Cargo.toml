[package]
name = "flux-graphics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "RHI, Vulkan/DX12, Render Graph, PBR"
publish = false

[features]
default = []
# GPU-бэкенды: контракты доступны всегда, реализации — за feature-гейтами.
vulkan = ["dep:ash"]
dx12 = []

[dependencies]
flux-core.workspace = true
flux-math.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
# Оконные handle для VkSurfaceKHR: типы платформенных дескрипторов (ADR-0034).
raw-window-handle = "0.6"
# ADR-0034: Vulkan bindings, runtime-загрузка (feature `vulkan`).
ash = { workspace = true, optional = true }

[dev-dependencies]
# ADR-0029: criterion — dev-only, бенчи extract/4.5.
criterion.workspace = true

[[bench]]
name = "extract"
harness = false

[lints]
workspace = true
